<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: elegant black radial gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="70%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <!-- Top glossy highlight -->
    <linearGradient id="glossTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom shadow for physical depth -->
    <linearGradient id="shadowBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Inner edge highlight -->
    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold metallic gradient for braces/J -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c8"/>
      <stop offset="40%" stop-color="#f5d78e"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Drop shadow for logo -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer soft shadow -->
    <filter id="outerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dx="0" dy="28"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Outer subtle shadow -->
  <rect x="60" y="60" width="904" height="904" rx="220" ry="220" fill="#000000" filter="url(#outerShadow)"/>

  <!-- Main squircle background -->
  <rect x="60" y="60" width="904" height="904" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Inner top-left edge light -->
  <rect x="68" y="68" width="888" height="888" rx="212" ry="212" fill="none" stroke="url(#edgeLight)" stroke-width="6"/>

  <!-- Top glossy sheen -->
  <rect x="60" y="60" width="904" height="904" rx="220" ry="220" fill="url(#glossTop)"/>

  <!-- Bottom physical shadow -->
  <rect x="60" y="60" width="904" height="904" rx="220" ry="220" fill="url(#shadowBottom)"/>

  <!-- Specular arc highlight (top-left physical reflection) -->
  <path d="M 180 220 Q 300 130 512 130 T 844 220" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.16"/>
  <path d="M 200 260 Q 320 190 512 190 T 824 260" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.08"/>

  <!-- Bold braces { } -->
  <g filter="url(#logoShadow)" fill="url(#goldGrad)">
    <!-- Left brace { -->
    <path d="M 310 330
             C 230 330, 230 430, 270 450
             C 310 470, 310 500, 270 520
             C 230 540, 230 640, 310 640
             L 330 640
             C 270 640, 270 560, 300 545
             C 330 530, 330 470, 300 455
             C 270 440, 270 350, 330 350
             Z" />
    <!-- Right brace } -->
    <path d="M 714 330
             C 794 330, 794 430, 754 450
             C 714 470, 714 500, 754 520
             C 794 540, 794 640, 714 640
             L 694 640
             C 754 640, 754 560, 724 545
             C 694 530, 694 470, 724 455
             C 754 440, 754 350, 694 350
             Z" />
  </g>

  <!-- Center stylized J -->
  <g filter="url(#logoShadow)" fill="url(#goldGrad)">
    <!-- J vertical stem + hook -->
    <path d="M 472 330 L 552 330 L 552 520
             C 552 585, 512 620, 462 620
             C 422 620, 392 595, 392 560
             C 392 540, 408 525, 428 525
             C 448 525, 462 540, 462 560
             C 462 575, 452 585, 437 585
             C 452 598, 482 595, 492 560
             L 492 360 L 472 360 Z" />
    <!-- Leaf diacritic -->
    <path d="M 560 280
             C 600 260, 640 280, 650 320
             C 620 300, 590 305, 572 320
             C 565 305, 562 290, 560 280 Z" />
  </g>
</svg>