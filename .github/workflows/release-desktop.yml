# ============================================================
# Tauri 桌面端发布 (Linux / macOS / Windows)
# 触发条件: 推送 v* tag 或 manual dispatch
# ============================================================
name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-gate:
    uses: ./.github/workflows/_version-gate.yml

  linux:
    needs: [version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "见 CHANGELOG"
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage

  macos:
    needs: [version-gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - name: Generate macOS icons
        run: npx tauri icon src-tauri/app-icon-source.png

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg,app

      - name: Save DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.ref_name }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 90

  windows:
    needs: [version-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Save NSIS installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90