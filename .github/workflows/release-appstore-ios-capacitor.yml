# ============================================================
# Capacitor iOS App Store 发布 (独立 iOS 项目)
# 构建 iOS .xcarchive, 导出 IPA, 上传到 App Store Connect
# 
# 这是 iOS 独立项目 (ios/App/App.xcodeproj), 使用 Capacitor SPM
# 加载 web 视图, 不含 Tauri Rust 层。与 Tauri iOS 共享同一个
# App Store Connect 应用记录 (com.jsonformatter.app)。
# ============================================================
name: Release iOS App Store (Capacitor)

on:
  push:
    branches:
      - appstore
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-gate:
    uses: ./.github/workflows/_version-gate.yml

  ios-capacitor:
    if: github.ref_name == 'appstore' || startsWith(github.ref, 'refs/tags/')
    needs: [version-gate]
    runs-on: macos-latest
    environment:
      name: appstore
    env:
      IOS_APPLE_CERTIFICATE: ${{ secrets.IOS_APPLE_CERTIFICATE }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_APP_ID_IOS: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
    steps:
      - uses: actions/checkout@v5

      # ---- App Store 版本重复快速拦截 ----
      - name: Write App Store Connect API key
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "APP_STORE_CONNECT_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Fail fast if iOS App Store version already exists
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
          APP_VERSION: ${{ github.ref_name }}
        run: python3 scripts/check-appstore-version.py IOS "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/ (web assets)
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - name: Copy web assets to iOS public/
        run: |
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          echo "✓ Web assets copied to ios/App/App/public/"

      # ---- Auto-increment build number ----
      - name: Auto-increment build number (CFBundleVersion)
        run: |
          node scripts/bump-build.js ios/App/App/Info.plist

      - name: Import Apple certificate (iOS)
        if: env.IOS_APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          echo "=== Signing identities ==="
          security find-identity -v -p codesigning build.keychain
          SIGNING_ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Detected signing identity: $SIGNING_ID"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_ID" >> $GITHUB_ENV

      - name: Install iOS provisioning profile
        if: env.IOS_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ios-profile.mobileprovision
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin 2>/dev/null <<< $(security cms -D -i ios-profile.mobileprovision 2>/dev/null))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin 2>/dev/null <<< $(security cms -D -i ios-profile.mobileprovision 2>/dev/null))
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          cp ios-profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Configure iOS signing in exportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 替换 exportOptions.plist 中的占位符
          if [ -n "$APPLE_TEAM_ID" ]; then
            sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" ios/App/exportOptions.plist
          fi
          # 替换 provisioning profile 名称
          if [ -n "$PROFILE_NAME" ]; then
            sed -i '' "s/match AppStore com.jsonformatter.app/$PROFILE_NAME/g" ios/App/exportOptions.plist
          fi
          echo "=== exportOptions.plist ==="
          cat ios/App/exportOptions.plist

      - name: Build iOS archive
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

          echo "=== Generated IPA ==="
          ls -lh build/*.ipa 2>/dev/null || echo "No IPA found"

      - name: Save IPA as artifact
        run: |
          IPA=$(find ios/App/build -name "*.ipa" -type f | head -1)
          if [ -n "$IPA" ]; then
            echo "IPA_PATH=$IPA" >> $GITHUB_ENV
            echo "IPA found: $IPA"
          else
            echo "No IPA found"
          fi
      - name: Upload IPA artifact
        if: env.IPA_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-ios-ipa-${{ github.ref_name }}
          path: ${{ env.IPA_PATH }}
          retention-days: 90

      - name: Upload IPA to App Store Connect
        if: env.APP_STORE_CONNECT_API_KEY != '' && env.APP_STORE_CONNECT_APP_ID_IOS != ''
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA=$(find ios/App/build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          echo "Uploading IPA: $IPA"

          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER" \
            --verbose

          echo "✓ IPA uploaded to App Store Connect"

      - name: Submit for review
        if: env.APP_STORE_CONNECT_API_KEY != '' && env.APP_STORE_CONNECT_APP_ID_IOS != ''
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
          APP_VERSION: ${{ github.ref_name }}
          MAX_WAIT_MINUTES: "25"
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEY_PATH"
          export APP_STORE_CONNECT_KEY_PATH="$KEY_PATH"

          CLEAN_VERSION="${APP_VERSION#v}"
          APP_VERSION="$CLEAN_VERSION" python3 scripts/submit-appstore-review.py IOS